name: downvideo

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8765"
      DOWNVIDEO_PUBLIC: "1"
      DOWNVIDEO_DATA_ROOT: /var/data
      DOWNVIDEO_PUBLIC_ORIGIN: "https://${DOMAIN:?Set DOMAIN to your public hostname}"
      DOWNVIDEO_ACCESS_USER: "${DOWNVIDEO_ACCESS_USER:-owner}"
      DOWNVIDEO_ACCESS_PASSWORD: "${DOWNVIDEO_ACCESS_PASSWORD:?Set a unique password of at least 20 characters}"
    expose:
      - "8765"
    # Only Caddy publishes ports. The API cannot be reached directly from the host.
    volumes:
      - downvideo_data:/var/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN to your public hostname}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  downvideo_data:
  caddy_data:
  caddy_config:

